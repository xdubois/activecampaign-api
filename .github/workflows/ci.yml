name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }} deps${{ matrix.guzzle && format(' / guzzle {0}', matrix.guzzle) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.1'
            dependencies: lowest
          - php: '8.4'
            dependencies: highest
            guzzle: '^7.9'
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin Guzzle major
        if: matrix.guzzle
        run: composer require "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Show installed Guzzle version
        run: composer show guzzlehttp/guzzle | grep -E '^versions'

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    name: Static analysis & coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none
